<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Land Cover Analysis Using Satellite Imagery and Deep Learning | Immersion Project</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            satellite: {
              400: '#38bdf8',
              500: '#0ea5e9',
              600: '#0284c7',
              950: '#082f49',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel UMD for zero-dependency standalone execution -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <style>
    body {
      background-color: #080d1a;
      color: #f1f5f9;
      font-family: 'Inter', sans-serif;
    }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #080d1a; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #0ea5e9; }
    .custom-scrollbar::-webkit-scrollbar { width: 5px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.5); }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.3); border-radius: 3px; }
    .leaflet-container { background: #050811 !important; }
    .leaflet-control-zoom { border: 1px solid rgba(56, 189, 248, 0.3) !important; border-radius: 8px !important; overflow: hidden; }
    .leaflet-control-zoom a { background-color: #0f172a !important; color: #38bdf8 !important; border-bottom: 1px solid rgba(56, 189, 248, 0.2) !important; }
    @keyframes probePulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(6, 182, 212, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(6, 182, 212, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(6, 182, 212, 0); }
    }
    .custom-probe-pin { animation: probePulse 2s infinite; }
  </style>
</head>
<body class="selection:bg-cyan-500 selection:text-slate-950">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // --- DATA ---
    const FIELD_OBSERVATIONS = [
      {
        id: "obs-1",
        title: "Urban & Residential Structures",
        category: "Built Environment",
        groundDescription: "Individual roof profiles, building footprints (approx. 8–15 m span), concrete pavement, and narrow intra-building spaces observed clearly at eye level.",
        satelliteChallenge: "A single 10 m x 10 m Sentinel-2 pixel (100 m²) frequently encloses both a building rooftop and adjacent pavement, producing mixed spectral signatures.",
        icon: "🏢",
        tags: ["Built-up", "Impervious Surface", "100 m² Footprint"],
        placeholder: "Field Observation Photo: Structural Footprints & Alleys [Location to be added]"
      },
      {
        id: "obs-2",
        title: "Road & Transportation Networks",
        category: "Infrastructure",
        groundDescription: "Asphalt single-lane roads (3.5–5 m width), unpaved dirt pathways (2–3 m), and drainage trenches flanking transportation corridors.",
        satelliteChallenge: "Road widths are significantly sub-pixel relative to 10 m GSD. Linear continuity is fragmented as road pixels blend into adjacent soil or grassy verges.",
        icon: "🛣️",
        tags: ["Sub-pixel Linear", "Transportation", "Corridor"],
        placeholder: "Field Observation Photo: Linear Corridors & Road Segments [Location to be added]"
      },
      {
        id: "obs-3",
        title: "Vegetation & Tree Canopies",
        category: "Natural Canopy",
        groundDescription: "Dense multi-tiered tree canopies, isolated roadside trees, hedgerows, and heterogeneous shrub vegetation with variable foliage health.",
        satelliteChallenge: "Individual tree crowns cannot be resolved; canopies are aggregated into a single spatial average, masking localized crown dieback or micro-biodiversity.",
        icon: "🌳",
        tags: ["Canopy", "Red Edge", "Chlorophyll"],
        placeholder: "Field Observation Photo: Tree Crown Heterogeneity [Location to be added]"
      },
      {
        id: "obs-4",
        title: "Agricultural Parcels & Cropland",
        category: "Agriculture",
        groundDescription: "Smallholder agricultural plots (often under 0.2 hectares), furrow lines, bunds, irrigation ditches, and staggered crop phenology stages.",
        satelliteChallenge: "Field boundary bunds (0.5–1 m wide) disappear completely; spectral response from adjacent plots with differing crops blend at parcel margins.",
        icon: "🌾",
        tags: ["Smallholder Plots", "Crop Phenology", "Field Bunds"],
        placeholder: "Field Observation Photo: Agricultural Plot Margins & Bunds [Location to be added]"
      },
      {
        id: "obs-5",
        title: "Water Bodies & Retention Basins",
        category: "Hydrology",
        groundDescription: "Community retention ponds, shallow ephemeral streams, marshy wetland edges, and drainage culverts with varying turbidity and weed cover.",
        satelliteChallenge: "Narrow channels and water-land interfaces experience spectral contamination from shoreline soil and reeds, leading to misclassified shoreline boundaries.",
        icon: "💧",
        tags: ["Hydrology", "Turbidity", "Edge Contamination"],
        placeholder: "Field Observation Photo: Water Body Margin & Turbidity [Location to be added]"
      },
      {
        id: "obs-6",
        title: "Open & Barren Land",
        category: "Terrestrial Surface",
        groundDescription: "Exposed sandy loam, dry compacted soil, active excavation zones, gravel deposits, and sparse seasonal ground cover.",
        satelliteChallenge: "High spectral similarity between dry bare soil, weathered concrete, and fallow agricultural fields complicates accurate land-use categorization.",
        icon: "⛰️",
        tags: ["Soil Matrix", "Spectral Confusion", "Fallow"],
        placeholder: "Field Observation Photo: Barren Surface & Exposed Soil [Location to be added]"
      }
    ];

    const SATELLITE_BANDS = [
      { band: "B1", name: "Coastal Aerosol", centralWavelength: "443 nm", spatialResolution: "60 m", purpose: "Atmospheric aerosol correction, coastal bathymetry, water column analysis", category: "Atmospheric" },
      { band: "B2", name: "Blue", centralWavelength: "490 nm", spatialResolution: "10 m", purpose: "True color visualization, soil/vegetation differentiation, atmospheric scattering", category: "VNIR" },
      { band: "B3", name: "Green", centralWavelength: "560 nm", spatialResolution: "10 m", purpose: "True color imaging, peak vegetation reflectance, water turbidity assessment", category: "VNIR" },
      { band: "B4", name: "Red", centralWavelength: "665 nm", spatialResolution: "10 m", purpose: "Chlorophyll absorption peak, vegetation vitality, NDVI calculation", category: "VNIR" },
      { band: "B5", name: "Vegetation Red Edge 1", centralWavelength: "705 nm", spatialResolution: "20 m", purpose: "Vegetation stress, chlorophyll content estimation, crop health tracking", category: "Red Edge" },
      { band: "B6", name: "Vegetation Red Edge 2", centralWavelength: "740 nm", spatialResolution: "20 m", purpose: "Leaf area index (LAI), canopy biochemistry, canopy biomass quantification", category: "Red Edge" },
      { band: "B7", name: "Vegetation Red Edge 3", centralWavelength: "783 nm", spatialResolution: "20 m", purpose: "Canopy structure, senescent vegetation monitoring, edge slope index", category: "Red Edge" },
      { band: "B8", name: "Broad NIR (Near Infrared)", centralWavelength: "842 nm", spatialResolution: "10 m", purpose: "Biomass estimation, land-water boundary delineation, standard NDVI/NDWI", category: "VNIR" },
      { band: "B8A", name: "Narrow NIR", centralWavelength: "865 nm", spatialResolution: "20 m", purpose: "Atmospheric water vapour correction, detailed vegetation spectral analysis", category: "VNIR" },
      { band: "B9", name: "Water Vapour", centralWavelength: "945 nm", spatialResolution: "60 m", purpose: "Atmospheric absorption modeling, column water vapor retrieval", category: "Atmospheric" },
      { band: "B10", name: "SWIR - Cirrus", centralWavelength: "1375 nm", spatialResolution: "60 m", purpose: "High-altitude cirrus cloud detection and scene contamination masking", category: "Atmospheric" },
      { band: "B11", name: "SWIR 1", centralWavelength: "1610 nm", spatialResolution: "20 m", purpose: "Snow/ice/cloud discrimination, canopy moisture content, soil moisture", category: "SWIR" },
      { band: "B12", name: "SWIR 2", centralWavelength: "2190 nm", spatialResolution: "20 m", purpose: "Geological mineral mapping, burned area identification, soil salinity", category: "SWIR" }
    ];

    const METHODOLOGY_STEPS = [
      { stepNumber: "01", title: "Sentinel-2 Imagery Ingestion", shortDesc: "Acquisition of Copernicus Sentinel-2 Level-2A surface reflectance tiles.", detailedDesc: "Automated retrieval of Bottom-Of-Atmosphere (BOA) corrected Level-2A granules covering the designated study area. The ingestion pipeline extracts all 13 spectral bands alongside sun-sensor geometry metadata.", inputs: "Copernicus Open Access Hub (SAFE/GeoTIFF format)", outputs: "Calibrated 13-band multispectral raster stack (12-bit DN surface reflectance)", tools: ["Sentinel Hub API", "Rasterio", "GDAL"] },
      { stepNumber: "02", title: "Cloud & Shadow Masking", shortDesc: "Screening opaque clouds, cirrus formations, and cloud shadows.", detailedDesc: "Application of Scene Classification Layer (SCL) masks and Band 10 cirrus thresholds to identify contaminated pixels. Invalid pixels are flagged or filled using multi-temporal compositing algorithms.", inputs: "Level-2A SCL quality bands, QA60 cloud bitmask", outputs: "Binary cloud/shadow validation mask & cleaned reflectance arrays", tools: ["NumPy", "SCL Classifier", "Rasterio Mask"] },
      { stepNumber: "03", title: "Normalization & Calibration", shortDesc: "Radiometric scaling, outlier removal, and spectral index synthesis.", detailedDesc: "Min-Max normalization of DN values to standard [0.0, 1.0] float32 tensors. Calculation of derived spectral indices (NDVI, NDWI, NDBI, SAVI) to augment neural network spatial-spectral feature representations.", inputs: "13-band BOA reflectance tensors", outputs: "Normalized float32 feature tensor + 4 auxiliary spectral index channels", tools: ["NumPy", "SciPy", "TorchVision"] },
      { stepNumber: "04", title: "Band Alignment & Resampling", shortDesc: "Harmonizing 20 m and 60 m bands to a shared spatial grid.", detailedDesc: "Sub-pixel geometric co-registration and bicubic / cubic-spline interpolation of lower-resolution bands (20 m and 60 m) to match the native 10 m grid coordinate reference system (CRS).", inputs: "Mixed resolution bands (10 m, 20 m, 60 m)", outputs: "Unified 10 m Ground Sample Distance (GSD) co-registered raster array", tools: ["GDAL Warp", "Rasterio Affine Transformation"] },
      { stepNumber: "05", title: "Image Tiling & Patch Extraction", shortDesc: "Subdividing large regional scenes into overlapping sub-patches.", detailedDesc: "Extraction of 256x256 pixel tiles with a 25% spatial overlap (stride 192) to maintain contextual coherence across patch boundaries during deep neural network batch processing.", inputs: "Full-scene multi-band aligned raster", outputs: "Directory of 256x256xN GeoTIFF patches with spatial bounding boxes", tools: ["Custom Python Patch Generator", "GeoPandas"] },
      { stepNumber: "06", title: "Deep Learning Model Processing", shortDesc: "Feature extraction across spectral and spatial receptive fields.", detailedDesc: "Forward pass through a deep neural architecture (Convolutional / Residual U-Net) designed to extract multi-scale spatial textures while preserving multispectral correlation across channels.", inputs: "Batch of normalized multispectral patches (B, C, H, W)", outputs: "High-dimensional latent feature representation tensor", tools: ["PyTorch", "TorchVision", "CUDA"] },
      { stepNumber: "07", title: "Super-Resolution Mapping", shortDesc: "Reconstruction of 4x finer spatial imagery (~2.5 m equivalent GSD).", detailedDesc: "Sub-pixel convolutional upsampling layers reconstruct sharp structural edges, resolving linear road corridors, building outlines, and intra-field boundaries originally blurred in 10 m pixels.", inputs: "Latent feature representations from encoder-decoder", outputs: "Enhanced fine-resolution 4x multi-channel reconstructed raster", tools: ["PyTorch PixelShuffle", "Sub-pixel Conv2D"] },
      { stepNumber: "08", title: "Land-Cover Semantic Mapping", shortDesc: "Pixel-wise classification into standard LULC categories.", detailedDesc: "A semantic segmentation head assigns each fine-resolution pixel to one of 6 target classes: Water Bodies, Built-up Structures, Dense Forest, Agricultural Cropland, Shrub/Grassland, and Bare Soil.", inputs: "Super-resolved feature maps", outputs: "Categorical Land Use / Land Cover (LULC) thematic raster", tools: ["Softmax Classifier", "Cross-Entropy Loss Layer"] },
      { stepNumber: "09", title: "Confidence & Uncertainty Estimation", shortDesc: "Quantifying model prediction confidence and epistemic uncertainty.", detailedDesc: "Application of Monte Carlo Dropout passes during inference to compute predictive entropy and variance across output classes, producing an interpretable spatial uncertainty map.", inputs: "Multi-pass stochastic forward evaluations", outputs: "Per-pixel uncertainty raster [0.0 = High Confidence, 1.0 = Ambiguous]", tools: ["Bayesian MC-Dropout", "Shannon Entropy Formula"] },
      { stepNumber: "10", title: "GIS Visualization & Cartography", shortDesc: "Tiling, projection conversion, and interactive WebGIS deployment.", detailedDesc: "Exporting results as Cloud-Optimized GeoTIFFs (COG) and Slippy Map XYZ tiles, integrated into an interactive WebGIS dashboard with custom colormaps, opacity controls, and vector overlays.", inputs: "Enhanced RGB, LULC raster, and Uncertainty GeoTIFFs", outputs: "Interactive Leaflet map layers, GIS shapefiles, and web service", tools: ["Leaflet", "PostGIS", "GDAL2Tiles", "React"] }
    ];

    const LAND_COVER_CLASSES = [
      { id: "water", name: "Water Bodies & Streams", hex: "#0ea5e9" },
      { id: "builtup", name: "Built-up & Infrastructure", hex: "#ef4444" },
      { id: "forest", name: "Dense Canopy & Forest", hex: "#10b981" },
      { id: "cropland", name: "Agricultural Cropland", hex: "#eab308" },
      { id: "shrub", name: "Shrubland & Grassland", hex: "#84cc16" },
      { id: "barren", name: "Barren Land & Bare Soil", hex: "#d97706" }
    ];

    const STUDY_PRESETS = [
      { id: "tn-agro", name: "Demo Study Area: Tamil Nadu Agro-Corridor", coordinates: [10.7905, 78.7047], zoom: 14, description: "Generic demo region in Central Tamil Nadu exhibiting mixed cropland, irrigation channels, and rural settlements." },
      { id: "tn-urban", name: "Demo Study Area: Tamil Nadu Peri-Urban Fringe", coordinates: [11.0168, 76.9558], zoom: 14, description: "Generic demo area in Western Tamil Nadu exhibiting industrial-residential clusters and road corridors." },
      { id: "tn-wetland", name: "Demo Study Area: Tamil Nadu Lake Basin", coordinates: [12.9249, 80.1300], zoom: 14, description: "Generic demo basin in Eastern Tamil Nadu featuring water bodies and wetland vegetation buffers." }
    ];

    // --- MAIN APP COMPONENT ---
    function App() {
      const [activeSection, setActiveSection] = useState('hero');
      const [sliderPos, setSliderPos] = useState(50);
      const [showGrid, setShowGrid] = useState(true);
      const [selectedObs, setSelectedObs] = useState(FIELD_OBSERVATIONS[0]);
      const [customPhotos, setCustomPhotos] = useState({});
      const [selectedStep, setSelectedStep] = useState(METHODOLOGY_STEPS[0]);
      const [selectedBandRes, setSelectedBandRes] = useState('All');
      const [mapLayer, setMapLayer] = useState('landcover');
      const [mapOpacity, setMapOpacity] = useState(85);
      const [selectedPreset, setSelectedPreset] = useState(STUDY_PRESETS[0]);
      const [showDemoPins, setShowDemoPins] = useState(true);
      const [probeData, setProbeData] = useState({
        lat: 10.7905, lng: 78.7047, predictedClass: 'Agricultural Cropland', classColor: '#eab308', confidence: 94.2, b2: 0.082, b3: 0.124, b4: 0.068, b8: 0.485
      });

      const mapContainerRef = useRef(null);
      const mapRef = useRef(null);
      const layerGroupRef = useRef(null);
      const markersGroupRef = useRef(null);

      // Handle photo upload
      const handlePhotoUpload = (e, id) => {
        const file = e.target.files?.[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (ev) => {
            setCustomPhotos(prev => ({ ...prev, [id]: ev.target.result }));
          };
          reader.readAsDataURL(file);
        }
      };

      // Leaflet Map Effect
      useEffect(() => {
        if (!mapContainerRef.current || !window.L) return;

        if (!mapRef.current) {
          const map = L.map(mapContainerRef.current, {
            center: selectedPreset.coordinates,
            zoom: selectedPreset.zoom,
            zoomControl: false
          });

          // OpenStreetMap Standard Tiles (No API key required)
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors',
            maxZoom: 19
          }).addTo(map);

          L.control.zoom({ position: 'bottomright' }).addTo(map);
          layerGroupRef.current = L.layerGroup().addTo(map);
          markersGroupRef.current = L.layerGroup().addTo(map);
          mapRef.current = map;

          map.on('click', (e) => {
            const lat = parseFloat(e.latlng.lat.toFixed(5));
            const lng = parseFloat(e.latlng.lng.toFixed(5));
            const hash = Math.abs(Math.sin(lat * 1000 + lng * 2000));
            const classIdx = Math.floor(hash * LAND_COVER_CLASSES.length);
            const chosen = LAND_COVER_CLASSES[classIdx];
            const conf = parseFloat((85 + hash * 14.5).toFixed(1));

            setProbeData({
              lat, lng, predictedClass: chosen.name, classColor: chosen.hex,
              confidence: conf, b2: parseFloat((0.04 + hash * 0.08).toFixed(3)),
              b3: parseFloat((0.06 + hash * 0.10).toFixed(3)), b4: parseFloat((0.03 + hash * 0.09).toFixed(3)),
              b8: parseFloat((0.25 + hash * 0.45).toFixed(3))
            });
          });
        }

        renderMapOverlay();
        renderMarkers();
      }, [selectedPreset, mapLayer, mapOpacity, showDemoPins]);

      const renderMarkers = () => {
        if (!mapRef.current || !markersGroupRef.current || !window.L) return;
        markersGroupRef.current.clearLayers();
        if (!showDemoPins) return;

        const [lat, lng] = selectedPreset.coordinates;
        const pts = [
          { name: 'Vegetation Sample', color: '#10b981', bg: '#10b981', symbol: '🌲', coords: [lat + 0.0045, lng - 0.0055], desc: 'Sample canopy segmentation point.' },
          { name: 'Built-up Sample', color: '#ef4444', bg: '#ef4444', symbol: '🏢', coords: [lat - 0.0035, lng + 0.0045], desc: 'Sample building footprint point.' },
          { name: 'Agricultural Sample', color: '#eab308', bg: '#eab308', symbol: '🌾', coords: [lat + 0.0055, lng + 0.0050], desc: 'Sample cropland parcel point.' },
          { name: 'Water Body Sample', color: '#0ea5e9', bg: '#0ea5e9', symbol: '💧', coords: [lat - 0.0050, lng - 0.0045], desc: 'Sample water mask demarcation point.' }
        ];

        pts.forEach(p => {
          const icon = L.divIcon({
            className: 'custom-demo-pin',
            html: `<div style="width:28px;height:28px;border-radius:50%;background:${p.bg};color:white;display:flex;align-items:center;justify-content:center;font-size:14px;box-shadow:0 4px 6px rgba(0,0,0,0.3);border:2px solid #0f172a;">${p.symbol}</div>`,
            iconSize: [28, 28],
            iconAnchor: [14, 14]
          });
          const popup = `
            <div style="font-family:sans-serif;color:#0f172a;min-width:180px;">
              <div style="font-size:10px;font-weight:bold;color:${p.color};text-transform:uppercase;">Demo / Prototype Data</div>
              <div style="font-size:12px;font-weight:bold;margin:2px 0;">${p.name}</div>
              <div style="font-size:11px;color:#475569;">${p.desc}</div>
              <div style="font-size:9px;color:#94a3b8;margin-top:4px;border-top:1px solid #e2e8f0;padding-top:2px;">[Demo Study Area — Tamil Nadu]</div>
            </div>
          `;
          L.marker(p.coords, { icon }).bindPopup(popup).addTo(markersGroupRef.current);
        });
      };

      const renderMapOverlay = () => {
        if (!mapRef.current || !layerGroupRef.current || !window.L) return;
        layerGroupRef.current.clearLayers();

        const [lat, lng] = selectedPreset.coordinates;
        const delta = 0.012;
        const bounds = [[lat - delta, lng - delta], [lat + delta, lng + delta]];

        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 512;
        const ctx = canvas.getContext('2d');

        if (mapLayer === 'sentinel') {
          for (let x = 0; x < 512; x += 16) {
            for (let y = 0; y < 512; y += 16) {
              const noise = Math.sin(x * 0.05) * Math.cos(y * 0.05);
              ctx.fillStyle = `rgb(${Math.floor(60 + noise * 30 + (x > 250 ? 50 : 0))}, ${Math.floor(110 + noise * 40)}, ${Math.floor(70 + noise * 20)})`;
              ctx.fillRect(x, y, 16, 16);
            }
          }
        } else if (mapLayer === 'superres') {
          const grad = ctx.createLinearGradient(0, 0, 512, 512);
          grad.addColorStop(0, '#2d6a4f'); grad.addColorStop(1, '#cad2c5');
          ctx.fillStyle = grad; ctx.fillRect(0, 0, 512, 512);
          ctx.strokeStyle = '#f8fafc'; ctx.lineWidth = 4;
          ctx.beginPath(); ctx.moveTo(180, 0); ctx.lineTo(180, 512); ctx.stroke();
          ctx.fillStyle = '#ef4444'; ctx.fillRect(260, 140, 36, 28); ctx.fillRect(320, 150, 44, 32);
        } else if (mapLayer === 'landcover') {
          ctx.fillStyle = 'rgba(14, 165, 233, 0.9)'; ctx.beginPath(); ctx.ellipse(120, 380, 100, 70, Math.PI / 6, 0, 2 * Math.PI); ctx.fill();
          ctx.fillStyle = 'rgba(16, 185, 129, 0.85)'; ctx.fillRect(0, 0, 220, 220);
          ctx.fillStyle = 'rgba(234, 179, 8, 0.85)'; ctx.fillRect(230, 0, 282, 200);
          ctx.fillStyle = 'rgba(132, 204, 22, 0.85)'; ctx.fillRect(0, 230, 200, 120);
          ctx.fillStyle = 'rgba(239, 68, 68, 0.9)'; ctx.fillRect(240, 210, 272, 160);
          ctx.fillStyle = 'rgba(217, 119, 6, 0.85)'; ctx.fillRect(240, 380, 272, 132);
        } else if (mapLayer === 'uncertainty') {
          const grad = ctx.createRadialGradient(256, 256, 40, 256, 256, 250);
          grad.addColorStop(0, 'rgba(16, 185, 129, 0.4)');
          grad.addColorStop(0.5, 'rgba(234, 179, 8, 0.7)');
          grad.addColorStop(1, 'rgba(239, 68, 68, 0.85)');
          ctx.fillStyle = grad; ctx.fillRect(0, 0, 512, 512);
        }

        const overlay = L.imageOverlay(canvas.toDataURL(), bounds, { opacity: mapOpacity / 100 });
        layerGroupRef.current.addLayer(overlay);
      };

      const filteredBands = selectedBandRes === 'All'
        ? SATELLITE_BANDS
        : SATELLITE_BANDS.filter(b => b.spatialResolution === selectedBandRes);

      return (
        <div className="min-h-screen bg-[#080d1a] text-slate-100 font-sans">
          
          {/* HEADER */}
          <header className="fixed top-0 left-0 right-0 z-50 bg-[#080d1a]/90 backdrop-blur-md border-b border-cyan-500/20 py-3">
            <div className="max-w-7xl mx-auto px-4 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-9 h-9 rounded-xl bg-cyan-950 border border-cyan-400/40 flex items-center justify-center text-cyan-400 font-bold">
                  🛰️
                </div>
                <div>
                  <span className="font-bold text-white tracking-tight">GeoDL<span className="text-cyan-400">.Immersion</span></span>
                  <p className="text-[10px] text-slate-400 font-mono">Sentinel-2 &bull; Super-Resolution</p>
                </div>
              </div>

              <nav className="hidden md:flex items-center gap-3 text-xs font-medium text-slate-300">
                <a href="#hero" className="hover:text-cyan-300">Overview</a>
                <a href="#field-observations" className="hover:text-cyan-300">Field Study</a>
                <a href="#problem" className="hover:text-cyan-300">Problem</a>
                <a href="#solution" className="hover:text-cyan-300">Solution</a>
